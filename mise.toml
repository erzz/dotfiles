# Supported mise configuration for normal operation: tools, repositories, shell activation,
# dotfiles, tasks, and the small control-plane package set live here. The apps overlay owns
# the bulk of host packages. Mise is the sole supported deployment and package control plane.

[settings.task]
run_auto_install = false

[tools]
bun = "1.3.13"
fnox = "1.35.3"
java = "26.0.1"
node = "24.21.0"
"npm:agent-browser" = "0.27.1"
"npm:@ingka-group-digital/skapa-design-system-mcp" = "0.5.5"
"npm:@tarquinen/opencode-dcp" = { version = "3.1.15", trust_policy_excludes = ["effect@4.0.0-beta.83"] }
"npm:@ingka-group-digital/workflows-mcp" = "3.11.0"
"npm:@playwright/mcp" = "0.0.70"
terraform = "1.16.1"
"aqua:terraform-linters/tflint" = "0.64.0"
maven = "3.9.15"
"npm:mcp-remote" = "0.1.38"

[tasks.preflight]
description = "Check the supported host and canonical dotfiles checkout"
run = "test \"$(uname -s)\" = Darwin || { printf '%s\\n' '[preflight] macOS (Darwin) is required.' >&2; exit 1; }; command -v brew >/dev/null 2>&1 || { printf '%s\\n' '[preflight] Homebrew is required.' >&2; exit 1; }; command -v mise >/dev/null 2>&1 || { printf '%s\\n' '[preflight] mise is required.' >&2; exit 1; }; test -d \"$HOME/dotfiles/.git\" && test -f \"$HOME/dotfiles/mise.toml\" || { printf '%s\\n' '[preflight] canonical checkout missing at $HOME/dotfiles.' >&2; exit 1; }"

[tasks.prepare]
description = "Install pre-auth packages and deploy fnox config, without project tools"
run = """mise -C "$HOME/dotfiles" run preflight || exit $?; export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" && mise --no-config -C "$HOME/dotfiles" bootstrap packages apply --yes brew:git brew:gh && bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" brew install --cask 1password 1password-cli && mise -C "$HOME/dotfiles" bootstrap --force-dotfiles dotfiles apply --yes ~/.config/fnox"""

[bootstrap.hooks.pre-packages]
run = """bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh""""

# Ensure fnox can find 1Password's `op` on Apple Silicon or Intel Homebrew.
[tasks.sync]
description = "Authenticate and fully converge root and apps declarations through fnox"
run = """mise -C "$HOME/dotfiles" run preflight || exit $?; export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh"; MISE_GITHUB_TOKEN="$(gh auth token)" && export MISE_GITHUB_TOKEN && test -n "$MISE_GITHUB_TOKEN" || { printf '%s\\n' 'GitHub authentication is required: run gh auth login.' >&2; exit 1; }; printf '%s\\n' '[sync] installing fnox'; mise -C "$HOME/dotfiles" install fnox && printf '%s\\n' '[sync] deploying configuration'; mise -C "$HOME/dotfiles" bootstrap --force-dotfiles dotfiles apply --yes ~/.config/fnox && mise -C "$HOME/dotfiles" bootstrap --force-dotfiles dotfiles apply --yes ~/.config/mise/config.toml && mise -C "$HOME/dotfiles" bootstrap --force-dotfiles dotfiles apply --yes ~/.config/mise/config.apps.toml && renderer_path="$HOME/dotfiles/bootstrap/render-private-config.sh" && mise -C "$HOME/dotfiles" exec fnox -- fnox exec --replace -- /bin/bash "$renderer_path" && printf '%s\\n' '[sync] converging apps and remaining declarations' && mise -C "$HOME/dotfiles" exec fnox -- fnox exec --replace -- mise -C "$HOME/dotfiles" -E apps bootstrap --force-dotfiles --yes && mise -C "$HOME/dotfiles" run casks && mise -C "$HOME/dotfiles" run fonts && mise -C "$HOME/dotfiles" run post-install"""

[tasks.render-private-config]
description = "Render fnox/1Password-backed private files (fnox and its config must already be installed)"
run = """fnox exec --replace -- /bin/bash "$HOME/dotfiles/bootstrap/render-private-config.sh""""

[tasks.casks]
description = "Install application casks with native Homebrew"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" brew bundle install --no-upgrade --file="$HOME/dotfiles/brew/Brewfile.casks""""

[tasks.fonts]
description = "Install fonts with native Homebrew"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" brew bundle install --no-upgrade --file="$HOME/dotfiles/brew/Brewfile.fonts""""

[tasks.office]
description = "Opt in to installing Microsoft Office casks"
run = "export PATH=\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH\"; bash \"$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh\" brew bundle install --no-upgrade --file=\"$HOME/dotfiles/brew/Brewfile.office\""

[tasks.post-install-tpm]
description = "Install configured tmux plugins through TPM"
run = "tpm_install=\"$HOME/.tmux/plugins/tpm/bin/install_plugins\"; if [ ! -x \"$tpm_install\" ]; then printf '%s\\n' '[post-install-tpm] TPM installer not found; skipping.'; exit 0; fi; if [ ! -e \"$HOME/.tmux.conf\" ] || ! grep -qE '^\\s*set\\s+-g\\s+@plugin' \"$HOME/.tmux.conf\" 2>/dev/null; then printf '%s\\n' '[post-install-tpm] no configured tmux plugins; skipping.'; exit 0; fi; \"$tpm_install\""

[tasks.post-install-gh-dash]
description = "Install the gh-dash GitHub CLI extension if absent"
run = "if [ -n \"${CI:-}\" ]; then printf '%s\\n' '[post-install-gh-dash] CI mode; skipping.'; exit 0; fi; command -v gh >/dev/null 2>&1 || { printf '%s\\n' '[post-install-gh-dash] gh CLI is required.' >&2; exit 1; }; if gh extension list | grep -q 'dlvhdr/gh-dash'; then printf '%s\\n' '[post-install-gh-dash] already installed.'; else gh extension install dlvhdr/gh-dash; fi"

[tasks.post-install-buildx]
description = "Link native Homebrew Docker Buildx into Docker CLI plugins"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh"; brew_prefix="$(bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" brew --prefix)"; buildx="$brew_prefix/bin/docker-buildx"; if [ ! -x "$buildx" ]; then printf '%s\\n' "[post-install-buildx] Homebrew docker-buildx binary not found at $buildx; install the brew:docker-buildx package first." >&2; exit 1; fi; mkdir -p "$HOME/.docker/cli-plugins"; ln -sfn "$buildx" "$HOME/.docker/cli-plugins/docker-buildx""""

[tasks.post-install-agent-browser]
description = "Install agent-browser browser assets outside CI"
run = "if [ -n \"${CI:-}\" ]; then printf '%s\\n' '[post-install-agent-browser] CI mode; skipping.'; exit 0; fi; if ! command -v mise >/dev/null 2>&1 || ! mise -C \"$HOME/dotfiles\" where npm:agent-browser >/dev/null 2>&1; then printf '%s\\n' '[post-install-agent-browser] agent-browser is not installed; skipping.'; exit 0; fi; mise -C \"$HOME/dotfiles\" x npm:agent-browser -- agent-browser install"

[tasks.post-install]
description = "Restore post-install integrations after convergence"
run = "mise -C \"$HOME/dotfiles\" run post-install-tpm && mise -C \"$HOME/dotfiles\" run post-install-gh-dash && mise -C \"$HOME/dotfiles\" run post-install-buildx && mise -C \"$HOME/dotfiles\" run post-install-agent-browser"

[tasks.install]
description = "Install all tools declared in the canonical mise.toml"
run = "export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; MISE_GITHUB_TOKEN=\"$(gh auth token)\" && export MISE_GITHUB_TOKEN && test -n \"$MISE_GITHUB_TOKEN\" || { printf '%s\\n' 'GitHub authentication is required: run gh auth login.' >&2; exit 1; }; mise -C \"$HOME/dotfiles\" install fnox && mise -C \"$HOME/dotfiles\" exec fnox -- fnox exec --replace -- mise -C \"$HOME/dotfiles\" install --jobs=4"

[tasks.apps]
description = "Install applications, fonts, and Mac App Store apps"
output = "interleave"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/bootstrap/ensure-native-homebrew.sh" && MISE_GITHUB_TOKEN="$(gh auth token)" && export MISE_GITHUB_TOKEN && test -n "$MISE_GITHUB_TOKEN" || { printf '%s\\n' 'GitHub authentication is required: run gh auth login.' >&2; exit 1; }; mise -C "$HOME/dotfiles" -E apps bootstrap packages apply --yes brew:mas && MISE_TERMINAL_PROGRESS=true mise -C "$HOME/dotfiles" -E apps bootstrap --only packages --yes && mise -C "$HOME/dotfiles" run render-private-config && mise -C "$HOME/dotfiles" run casks && mise -C "$HOME/dotfiles" run fonts && mise -C "$HOME/dotfiles" run post-install"""

[tasks.setup]
description = "Compatibility alias for sync"
run = "mise -C \"$HOME/dotfiles\" run sync"

[tasks.macos]
description = "Retry the safe root macOS defaults targeted by sync"
run = "mise -C \"$HOME/dotfiles\" bootstrap --only macos-defaults --yes"

[tasks.check]
description = "Show pending mise bootstrap changes"
run = "mise -C \"$HOME/dotfiles\" bootstrap status --missing"

# Repository cloning provides the repeatable native setup for these integrations. Pin repositories
# where an upstream version tag exists; Oh My Zsh has no published stable release tag and remains
# on its documented default branch.
[bootstrap.repos."~/.oh-my-zsh"]
url = "https://github.com/ohmyzsh/ohmyzsh.git"

[bootstrap.repos."~/.tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm.git"
ref = "v3.1.0"

[bootstrap.repos."~/.tmux/plugins/tmux-power"]
url = "https://github.com/wfxr/tmux-power.git"
ref = "v1"

[bootstrap.repos."~/.tmux/plugins/tmux-resurrect"]
url = "https://github.com/tmux-plugins/tmux-resurrect.git"
ref = "v4.0.0"

[bootstrap.repos."~/.tmux/plugins/tmux-continuum"]
url = "https://github.com/tmux-plugins/tmux-continuum.git"
ref = "v3.1.0"

[bootstrap.packages]
"brew:git" = { os = ["macos"] }
"brew:gh" = { os = ["macos"] }

# Safe declarative macOS defaults included in normal sync; `macos` remains a targeted retry.
# Imperative operations (chflags, systemsetup, process kills, and reboot) are excluded.
[bootstrap.macos.defaults."NSGlobalDomain"]
"com.apple.springing.enabled" = true
"com.apple.springing.delay" = 0.0
AppleShowAllExtensions = true
NSNavPanelExpandedStateForSaveMode = true
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
"com.apple.swipescrolldirection" = false
ApplePressAndHoldEnabled = false

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48
"minimize-to-application" = true
"show-process-indicators" = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.finder"]
FXPreferredViewStyle = "Nlsv"
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
ShowMountedServersOnDesktop = true
ShowHardDrivesOnDesktop = true
AppleShowAllFiles = true
ShowStatusBar = true
ShowPathbar = true
_FXShowPosixPathInTitle = true
_FXSortFoldersFirst = true
NewWindowTarget = "PfHm"
FXDefaultSearchScope = "SCev"
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults."com.apple.frameworks.diskimages"]
"skip-verify" = true
"skip-verify-locked" = true
"skip-verify-remote" = true

[bootstrap.macos.defaults."com.apple.loginwindow"]
SHOWFULLNAME = true

[bootstrap.macos.defaults."com.apple.NetworkBrowser"]
BrowseAllInterfaces = true

[bootstrap.macos.defaults."com.apple.screencapture"]
type = "png"

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zsh = "activate"

[bootstrap.secrets]
npm_org_scope = "NPM_ORG_SCOPE"
npm_registry_host = "NPM_REGISTRY_HOST"
github_org_scope = "GITHUB_ORG_SCOPE"
GH_TOKEN = "GH_TOKEN"
ARTIFACTORY_AUTH_TOKEN = "ARTIFACTORY_AUTH_TOKEN"
NPM_TOKEN = "NPM_TOKEN"
LINEARB_API_KEY = "LINEARB_API_KEY"

# Repository content is deployed through this mise-owned dotfiles table.
[dotfiles]
"~/.zshrc" = { source = "configs/zsh/.zshrc", mode = "symlink" }
"~/.gitconfig" = { source = "configs/git/.gitconfig", mode = "symlink" }
"~/.tmux.conf" = { source = "configs/tmux/.tmux.conf", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "configs/mise/config.toml", mode = "symlink" }
"~/.config/mise/config.apps.toml" = { source = "configs/mise/config.apps.toml", mode = "symlink" }
"~/.config/fnox" = { source = "configs/fnox", mode = "symlink" }
"~/.config/nvim" = { source = "configs/nvim", mode = "symlink" }
"~/.config/opencode" = { source = "configs/opencode", mode = "symlink" }
"~/.config/zed" = { source = "configs/zed", mode = "symlink" }
"~/.config/ghostty" = { source = "configs/ghostty", mode = "symlink" }
"~/.config/zellij" = { source = "configs/zellij", mode = "symlink" }
"~/.config/starship.toml" = { source = "configs/starship/starship.toml", mode = "symlink" }
"~/.config/direnv" = { source = "configs/direnv", mode = "symlink" }
"~/.config/colima/default/colima.yaml" = { source = "configs/colima/default/colima.yaml", mode = "symlink" }
"~/.config/gh-dash" = { source = "configs/gh-dash", mode = "symlink" }
"~/.config/herdr" = { source = "configs/herdr", mode = "symlink" }
"~/.config/git" = { source = "configs/git", mode = "symlink" }
"~/.config/prettierd" = { source = "configs/prettierd", mode = "symlink" }
