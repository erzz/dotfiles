# Parallel package migration: Brewfile remains authoritative until clean-machine
# validation. Mise's package inventory does not cover all Homebrew DSL/service behavior.

[tools]
bun = "latest"
java = "latest"
node = "24"
"npm:agent-browser" = "latest"
"npm:@ingka-group-digital/skapa-design-system-mcp" = "0.5.5"
"npm:@tarquinen/opencode-dcp" = "3.1.14"
"npm:@ingka-group-digital/workflows-mcp" = "latest"
"npm:@playwright/mcp" = "latest"
terraform = "latest"
maven = "latest"
"npm:mcp-remote" = "latest"

# Staged finalizer migration: repo cloning replaces the clone portion of the
# legacy finalizers. Oh My Zsh uses its documented default branch for now;
# pinning it remains a follow-up because no justified repository version is
# present in the current configuration.
[bootstrap.repos."~/.oh-my-zsh"]
url = "https://github.com/ohmyzsh/ohmyzsh.git"

[bootstrap.repos."~/.tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm.git"

[bootstrap.repos."~/.tmux/plugins/tmux-power"]
url = "https://github.com/wfxr/tmux-power.git"

[bootstrap.repos."~/.tmux/plugins/tmux-resurrect"]
url = "https://github.com/tmux-plugins/tmux-resurrect.git"

[bootstrap.repos."~/.tmux/plugins/tmux-continuum"]
url = "https://github.com/tmux-plugins/tmux-continuum.git"

# Intentionally not claimed declaratively here: TPM's install_plugins,
# gh-dash extension installation, the computed Docker Buildx symlink, and
# agent-browser asset installation remain outside this staged migration.

