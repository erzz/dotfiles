# Supported mise configuration for normal operation: tools, repositories, shell activation,
# dotfiles, tasks, and the small control-plane package set live here. The apps overlay owns
# the bulk of host packages. Mise is the sole supported deployment and package control plane.

[settings.task]
run_auto_install = false

[tools]
bun = "1.3.13"
fnox = "1.35.3"
java = "26.0.1"
node = "24.21.0"
"npm:markdownlint-cli" = { version = "0.49.1", os = ["linux"] }
"npm:vscode-langservers-extracted" = { version = "4.10.0", os = ["linux"] }
"npm:@fsouza/prettierd" = { version = "0.29.0", os = ["linux"] }
"npm:agent-browser" = "0.27.1"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:@microsoft/compose-language-service" = "1.0.0"
"npm:@ingka-group-digital/skapa-design-system-mcp" = { version = "0.5.5", os = ["macos"] }
"npm:@ingka-group-digital/workflows-mcp" = { version = "3.11.0", os = ["macos"] }
"npm:@playwright/mcp" = "0.0.70"
terraform = "1.16.1"
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:artempyanykh/marksman" = { version = "2026-02-08", os = ["linux"] }
"aqua:anchore/grype" = { version = "0.120.0", os = ["linux"] }
"aqua:hadolint/hadolint" = { version = "2.15.1", os = ["linux"] }
"aqua:hashicorp/terraform-ls" = { version = "0.39.0", os = ["linux"] }
"aqua:google/google-java-format" = { version = "1.37.0", os = ["linux"] }
maven = "3.9.15"
"npm:mcp-remote" = "0.1.38"

[tasks.preflight]
description = "Check the supported host and canonical dotfiles checkout"
run = "test \"$(uname -s)\" = Darwin || { printf '%s\\n' '[preflight] macOS (Darwin) is required.' >&2; exit 1; }; command -v brew >/dev/null 2>&1 || { printf '%s\\n' '[preflight] Homebrew is required.' >&2; exit 1; }; command -v mise >/dev/null 2>&1 || { printf '%s\\n' '[preflight] mise is required.' >&2; exit 1; }; test -d \"$HOME/dotfiles/.git\" && test -f \"$HOME/dotfiles/mise.toml\" || { printf '%s\\n' '[preflight] canonical checkout missing at $HOME/dotfiles.' >&2; exit 1; }"

[tasks.prepare]
description = "Install pre-auth packages and deploy fnox config, without project tools"
run = """mise -C "$HOME/dotfiles" run preflight || exit $?; export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh" && mise --no-config -C "$HOME/dotfiles" bootstrap packages apply --yes brew:git brew:gh && bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh" brew install --cask 1password 1password-cli && mise -C "$HOME/dotfiles" bootstrap --force-dotfiles dotfiles apply --yes ~/.config/fnox"""

[bootstrap.hooks.pre-packages]
run = """bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh""""

# Ensure fnox can find 1Password's `op` on Apple Silicon or Intel Homebrew.
[tasks.sync]
description = "Converge dotfiles for the current supported platform"
run = "bash \"$HOME/dotfiles/scripts/sync.sh\""

[tasks.apply-private-config]
description = "Apply fnox/1Password-backed native mise file templates"
run = """fnox --non-interactive --no-daemon --if-missing error exec --replace -- mise -C "$HOME/dotfiles" bootstrap files apply --yes"""

[tasks.casks]
description = "Install application casks with native Homebrew"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh" brew bundle install --no-upgrade --file="$HOME/dotfiles/macos/brew/Brewfile.casks""""

[tasks.fonts]
description = "Install fonts with native Homebrew"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh" brew bundle install --no-upgrade --file="$HOME/dotfiles/macos/brew/Brewfile.fonts""""

[tasks.office]
description = "Opt in to installing Microsoft Office casks"
run = "export PATH=\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH\"; bash \"$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh\" brew bundle install --no-upgrade --file=\"$HOME/dotfiles/macos/brew/Brewfile.office\""

[tasks.opencode-v2]
description = "Install the macOS OpenCode v2 formula through native Homebrew"
run = """bash -euo pipefail -c '
dotfiles="$HOME/dotfiles"
export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
helper="$dotfiles/macos/scripts/ensure-native-homebrew.sh"
bash "$helper"
installed_formulas="$(bash "$helper" brew list --formula --full-name)"
if printf "%s\\n" "$installed_formulas" | /usr/bin/grep -Fxq "anomalyco/tap/opencode"; then
  printf "%s\\n" "[opencode-v2] Homebrew v1 OpenCode conflicts with opencode-v2. Manually run: brew uninstall anomalyco/tap/opencode, then rerun this task." >&2
  exit 1
fi
bash "$helper" brew bundle install --no-upgrade --file="$dotfiles/macos/brew/Brewfile.opencode"
'"""

[tasks.post-install-tpm]
description = "Install configured tmux plugins through TPM"
run = "tpm_install=\"$HOME/.tmux/plugins/tpm/bin/install_plugins\"; if [ ! -x \"$tpm_install\" ]; then printf '%s\\n' '[post-install-tpm] TPM installer not found; skipping.'; exit 0; fi; if [ ! -e \"$HOME/.tmux.conf\" ] || ! grep -qE '^\\s*set\\s+-g\\s+@plugin' \"$HOME/.tmux.conf\" 2>/dev/null; then printf '%s\\n' '[post-install-tpm] no configured tmux plugins; skipping.'; exit 0; fi; \"$tpm_install\""

[tasks.post-install-gh-dash]
description = "Install the gh-dash GitHub CLI extension if absent"
run = "if [ -n \"${CI:-}\" ]; then printf '%s\\n' '[post-install-gh-dash] CI mode; skipping.'; exit 0; fi; command -v gh >/dev/null 2>&1 || { printf '%s\\n' '[post-install-gh-dash] gh CLI is required.' >&2; exit 1; }; if gh extension list | grep -q 'dlvhdr/gh-dash'; then printf '%s\\n' '[post-install-gh-dash] already installed.'; else gh extension install dlvhdr/gh-dash; fi"

[tasks.post-install-buildx]
description = "Link native Homebrew Docker Buildx into Docker CLI plugins"
run = """export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh"; brew_prefix="$(bash "$HOME/dotfiles/macos/scripts/ensure-native-homebrew.sh" brew --prefix)"; buildx="$brew_prefix/bin/docker-buildx"; if [ ! -x "$buildx" ]; then printf '%s\\n' "[post-install-buildx] Homebrew docker-buildx binary not found at $buildx; install the brew:docker-buildx package first." >&2; exit 1; fi; mkdir -p "$HOME/.docker/cli-plugins"; ln -sfn "$buildx" "$HOME/.docker/cli-plugins/docker-buildx""""

[tasks.post-install-agent-browser]
description = "Install agent-browser browser assets outside CI"
run = "if [ -n \"${CI:-}\" ]; then printf '%s\\n' '[post-install-agent-browser] CI mode; skipping.'; exit 0; fi; if ! command -v mise >/dev/null 2>&1 || ! mise -C \"$HOME/dotfiles\" where npm:agent-browser >/dev/null 2>&1; then printf '%s\\n' '[post-install-agent-browser] agent-browser is not installed; skipping.'; exit 0; fi; mise -C \"$HOME/dotfiles\" x npm:agent-browser -- agent-browser install"

[tasks.post-install]
description = "Restore post-install integrations after convergence"
run = "mise -C \"$HOME/dotfiles\" run post-install-tpm && mise -C \"$HOME/dotfiles\" run post-install-gh-dash && mise -C \"$HOME/dotfiles\" run post-install-buildx && mise -C \"$HOME/dotfiles\" run post-install-agent-browser"

[tasks.install]
description = "Install all tools declared in the canonical mise.toml"
run = "export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; MISE_GITHUB_TOKEN=\"$(gh auth token)\" && export MISE_GITHUB_TOKEN && test -n \"$MISE_GITHUB_TOKEN\" || { printf '%s\\n' 'GitHub authentication is required: run gh auth login.' >&2; exit 1; }; mise -C \"$HOME/dotfiles\" --yes install fnox && mise -C \"$HOME/dotfiles\" exec fnox -- fnox --non-interactive --no-daemon --if-missing error exec --replace -- mise -C \"$HOME/dotfiles\" --yes install --jobs=4"

[tasks.apps]
description = "Install applications, fonts, and Mac App Store apps"
output = "interleave"
run = "bash \"$HOME/dotfiles/macos/scripts/apps.sh\""

[tasks.setup]
description = "Compatibility alias for sync"
run = "mise -C \"$HOME/dotfiles\" run sync"

[tasks.macos]
description = "Retry the safe root macOS defaults targeted by sync"
run = "mise -C \"$HOME/dotfiles\" bootstrap --only macos-defaults --yes"

[tasks.check]
description = "Show pending mise bootstrap changes"
run = "mise -C \"$HOME/dotfiles\" bootstrap status --missing"

[tasks.omarchy-preflight]
description = "Check the supported Omarchy host and canonical dotfiles checkout"
run = "bash \"$HOME/dotfiles/omarchy/scripts/omarchy-preflight.sh\""

[tasks.omarchy-sync]
description = "Converge shared tools and safe dotfiles on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/sync-omarchy.sh\""

[tasks.omarchy-install-packages]
description = "Install the additive Arch and AUR package inventory"
run = "bash \"$HOME/dotfiles/omarchy/scripts/packages-omarchy.sh\""

[tasks.omarchy-install-apps]
description = "Install selected additive GUI applications on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/apps-omarchy.sh\""

[tasks.omarchy-private-config]
description = "Apply optional fnox/1Password-backed files on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/private-config-omarchy.sh\""

[tasks.omarchy-private]
description = "Use a supplied 1Password service token to install private tools on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/private-omarchy.sh\""

[tasks.omarchy-post-install]
description = "Restore portable tmux, gh-dash, and agent-browser integrations on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/post-install-omarchy.sh\""

# Repository cloning provides the repeatable native setup for these integrations. Pin repositories
# where an upstream version tag exists; Oh My Zsh has no published stable release tag and remains
# on its documented default branch.
[bootstrap.repos."~/.oh-my-zsh"]
url = "https://github.com/ohmyzsh/ohmyzsh.git"

[bootstrap.repos."~/.tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm.git"
ref = "v3.1.0"

[bootstrap.repos."~/.tmux/plugins/tmux-power"]
url = "https://github.com/wfxr/tmux-power.git"
ref = "v1"

[bootstrap.repos."~/.tmux/plugins/tmux-resurrect"]
url = "https://github.com/tmux-plugins/tmux-resurrect.git"
ref = "v4.0.0"

[bootstrap.repos."~/.tmux/plugins/tmux-continuum"]
url = "https://github.com/tmux-plugins/tmux-continuum.git"
ref = "v3.1.0"

[bootstrap.packages]
"brew:git" = { os = ["macos"] }
"brew:gh" = { os = ["macos"] }

# Safe declarative macOS defaults included in normal sync; `macos` remains a targeted retry.
# Imperative operations (chflags, systemsetup, process kills, and reboot) are excluded.
[bootstrap.macos.defaults."NSGlobalDomain"]
"com.apple.springing.enabled" = true
"com.apple.springing.delay" = 0.0
AppleShowAllExtensions = true
NSNavPanelExpandedStateForSaveMode = true
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
"com.apple.swipescrolldirection" = false
ApplePressAndHoldEnabled = false

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48
"minimize-to-application" = true
"show-process-indicators" = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.finder"]
FXPreferredViewStyle = "Nlsv"
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
ShowMountedServersOnDesktop = true
ShowHardDrivesOnDesktop = true
AppleShowAllFiles = true
ShowStatusBar = true
ShowPathbar = true
_FXShowPosixPathInTitle = true
_FXSortFoldersFirst = true
NewWindowTarget = "PfHm"
FXDefaultSearchScope = "SCev"
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults."com.apple.frameworks.diskimages"]
"skip-verify" = true
"skip-verify-locked" = true
"skip-verify-remote" = true

[bootstrap.macos.defaults."com.apple.loginwindow"]
SHOWFULLNAME = true

[bootstrap.macos.defaults."com.apple.NetworkBrowser"]
BrowseAllInterfaces = true

[bootstrap.macos.defaults."com.apple.screencapture"]
type = "png"

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zsh = "activate"

[bootstrap.secrets]
NPM_ORG_SCOPE = "NPM_ORG_SCOPE"
NPM_REGISTRY_HOST = "NPM_REGISTRY_HOST"
GITHUB_ORG_SCOPE = "GITHUB_ORG_SCOPE"
GH_TOKEN = "GH_TOKEN"
ARTIFACTORY_AUTH_TOKEN = "ARTIFACTORY_AUTH_TOKEN"
NPM_TOKEN = "NPM_TOKEN"
LINEARB_API_KEY = "LINEARB_API_KEY"

[bootstrap.files."~/.local/state/secrets.env"]
source = "common/templates/secrets.env.tmpl"
template = true
mode = "0600"

[bootstrap.files."~/.npmrc"]
source = "common/templates/npmrc.tmpl"
template = true
mode = "0600"

# Repository content is deployed through this mise-owned dotfiles table.
[dotfiles]
"~/.zshrc" = { source = "macos/configs/zsh/.zshrc", mode = "symlink" }
"~/.gitconfig" = { source = "macos/configs/git/.gitconfig", mode = "symlink" }
"~/.tmux.conf" = { source = "common/configs/tmux/.tmux.conf", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "common/configs/mise/config.toml", mode = "symlink" }
"~/.config/mise/config.apps.toml" = { source = "macos/configs/mise/config.apps.toml", mode = "symlink" }
"~/.config/fnox" = { source = "common/configs/fnox", mode = "symlink" }
"~/.config/nvim" = { source = "common/configs/nvim", mode = "symlink" }
"~/.config/opencode" = { source = "common/configs/opencode", mode = "symlink" }
"~/.config/zed" = { source = "macos/configs/zed", mode = "symlink" }
"~/.config/ghostty" = { source = "macos/configs/ghostty", mode = "symlink" }
"~/.config/zellij" = { source = "common/configs/zellij", mode = "symlink" }
"~/.config/tuios" = { source = "common/configs/tuios", mode = "symlink" }
"~/.config/starship.toml" = { source = "common/configs/starship/starship.toml", mode = "symlink" }
"~/.config/direnv" = { source = "common/configs/direnv", mode = "symlink" }
"~/.config/colima/default/colima.yaml" = { source = "macos/configs/colima/default/colima.yaml", mode = "symlink" }
"~/.config/gh-dash" = { source = "common/configs/gh-dash", mode = "symlink" }
"~/.config/herdr" = { source = "common/configs/herdr", mode = "symlink" }
"~/.config/git/.gitconfig" = { source = "macos/configs/git/.gitconfig", mode = "symlink" }
"~/.config/git/ignore" = { source = "common/configs/git/ignore", mode = "symlink" }
"~/.config/prettierd" = { source = "common/configs/prettierd", mode = "symlink" }
