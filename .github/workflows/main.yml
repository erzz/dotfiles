name: Test Dotfiles
on: push

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          # zsh syntax (e.g. `&!` disown) trips up shellcheck
          ignore_paths: configs/zsh

  # Fast Linux container job: validates the native mise configuration and
  # repository-owned checks without credentials or host package installs.
  test-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 5
    env:
      HOME: /root
    steps:
      - name: Install prerequisites
        run: |
          pacman -Sy --noconfirm git bash zsh tmux mise jq

      - uses: actions/checkout@v4

      - name: Validate mise configuration and tasks
        run: |
          mise tasks validate
          mise config ls >/dev/null
          mise -E apps config ls >/dev/null
          mise bootstrap status >/dev/null
          mise -E apps bootstrap status >/dev/null

      - name: Run test suite
        run: bash tests/run.sh
        working-directory: ${{ github.workspace }}

  # macOS validates the same repository-native checks. It intentionally does
  # not run authenticated sync or install casks/apps.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: brew install mise

      - name: Validate mise configuration and tasks
        run: |
          mise tasks validate
          mise config ls >/dev/null
          mise -E apps config ls >/dev/null
          mise bootstrap status >/dev/null
          mise -E apps bootstrap status >/dev/null

      - name: Run test suite
        run: bash tests/run.sh
