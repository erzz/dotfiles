# Additive Omarchy fragment. Omarchy's global config remains authoritative.

[tools]
bun = "1.3.13"
fnox = "1.35.3"
java = "26.0.1"
node = "24.21.0"
shellcheck = "0.11.0"
"npm:markdownlint-cli" = "0.49.1"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:@fsouza/prettierd" = "0.29.0"
"npm:agent-browser" = "0.27.1"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:@microsoft/compose-language-service" = "1.0.0"
"npm:@playwright/mcp" = "0.0.70"
terraform = "1.16.1"
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:artempyanykh/marksman" = "2026-02-08"
"aqua:anchore/grype" = "0.120.0"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:hashicorp/terraform-ls" = "0.39.0"
"aqua:google/google-java-format" = "1.37.0"
maven = "3.9.15"
"npm:mcp-remote" = "0.1.38"

[tasks.omarchy-preflight]
description = "Check the Omarchy host and canonical dotfiles checkout"
run = "bash \"$HOME/dotfiles/omarchy/scripts/omarchy-preflight.sh\""

[tasks.sync]
description = "Converge dotfiles for the current supported platform"
run = "bash \"$HOME/dotfiles/scripts/sync.sh\""

[tasks.omarchy-sync]
description = "Converge shared tools and safe dotfiles on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/sync-omarchy.sh\""

[tasks.omarchy-install-packages]
description = "Install the additive Arch and AUR package inventory"
run = "bash \"$HOME/dotfiles/omarchy/scripts/packages-omarchy.sh\""

[tasks.omarchy-install-apps]
description = "Install selected additive GUI applications on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/apps-omarchy.sh\""

[tasks.omarchy-private-config]
description = "Apply optional fnox/1Password-backed files on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/private-config-omarchy.sh\""

[tasks.omarchy-private]
description = "Use a supplied 1Password service token to install private tools on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/private-omarchy.sh\""

[tasks.omarchy-post-install]
description = "Restore portable tmux, gh-dash, and agent-browser integrations on Omarchy"
run = "bash \"$HOME/dotfiles/omarchy/scripts/post-install-omarchy.sh\""

[dotfiles."~/.config/hypr/input.lua"]
source = "~/dotfiles/omarchy/configs/hypr/input.lua"
mode = "symlink"
